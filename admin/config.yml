        required: false

      - label: "Gambar Utama Artikel"
        name: image
        widget: image
        hint: "📐 UKURAN STANDAR DEFAULT: 1200×675 px atau 800×450 px (Rasio 16:9 Landscape) atau 900×600 px (Rasio 3:2, format WebP/JPG). Gambar ini tampil sebagai thumbnail kartu berita dan gambar utama header postingan."

      - label: "Judul Artikel Blog"
        name: judul-post
        widget: string
        hint: "Judul artikel yang menarik minat pembaca (Rekomendasi: 50–70 karakter)."

      - label: "Nama Penulis"
        name: nama-penulis
        widget: string
        hint: "Nama penulis artikel (contoh: Denny Rakhmad Widi Ashari)."

      - label: "Kategori / Kolom Label"
        name: kolom
        widget: select
        hint: "Kategori badge pada kartu artikel"
        options:

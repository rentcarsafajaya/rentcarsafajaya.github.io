          - NEWS
          - INFO

      - label: "Tanggal Publikasi"
        name: date
        widget: datetime
        format: "YYYY-MM-DD"
        date_format: "YYYY-MM-DD"
        time_format: false
        hint: "Tanggal artikel diterbitkan."

      - label: "Tanggal Pembaruan (Opsional)"
        name: modified-date
        widget: datetime
        format: "YYYY-MM-DD"
        date_format: "YYYY-MM-DD"
        time_format: false
        required: false
        hint: "Tanggal saat isi artikel diperbarui."

      - label: "Deskripsi Meta SEO"
        name: description
        widget: text
        hint: "Deskripsi ringkas cuplikan Google Search (Rekomendasi: 140–160 karakter)."

      - label: "Kata Kunci Meta (Keywords)"
        name: keyword
        widget: string
        hint: "Kata kunci topik artikel, pisahkan dengan tanda koma."

      - label: "Isi Konten Artikel Lengkap"
        name: body
        widget: markdown
        hint: "Tulis isi artikel lengkap menggunakan Markdown (gunakan Heading 2, paragraf, daftar list, dan gambar ilustrasi pendukung)."

